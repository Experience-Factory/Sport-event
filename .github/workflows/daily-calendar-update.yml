name: Daily calendar update

on:
  schedule:
    - cron: '0 6 * * *'   # ~06:00 UTC every day (roughly 07:00-08:00 Belgian time)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch new events and update index.html
        id: run
        run: python scripts/update_calendar.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes."
            exit 0
          fi
          git config user.name "sports-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Daily auto-update: new live sport events"
          git push

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily calendar update is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = issues.find(i => i.title === title);
            const body = `The daily calendar-update workflow failed.\n\nRun: ${runUrl}\n\nThis usually means Sporza or RTBF changed something on their end (page structure, API response shape). Check the run logs for the exact error.`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
